<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">


    <title>GTA</title>

<body>
    <p class="nome">Lucia</p>

    <img class="personagem" src="img/lucia.png">

    <div class="textos">
        <p class="etiqueta">Selecione o seu Personagem</p>
        <h1>Não é só <br>um Jogo.</h1>
        <p class="texto-apoio">Escolha uma lenda de Dev City. Ou tire uma selfie e vire uma.</p>
    </div>

    <div class="menu">

        <img onclick="escolherPersonagem('Lucia', 'img/lucia.png', '#e32591')" class="avatar" src="img/lucia.png">
        <img onclick="escolherPersonagem('Jason', 'img/jason.png', '#00b2c9')" class="avatar" src="img/jason.png">
        <img onclick="escolherPersonagem('CJ', 'img/cj.png','#00ff00')" class="avatar" src="img/cj.png">
        <label class="voce">📸
            <input type="file" accept="image/*" hidden onchange="lerFoto(this)">
        </label>

    </div>
</body>
